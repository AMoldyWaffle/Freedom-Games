<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo CE</title>
<meta name="theme-color" content="#0b1220">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b1220; color: #e8eefb; padding: 20px;
  }
  main { max-width: 520px; }
  h1 { margin: 0 0 12px; }
  p { color: #9aa8c4; line-height: 1.5; }
  a { color: #4aa3ff; }
  code { background: #121c30; padding: 1px 6px; border-radius: 4px; }
  .err { color: #ff9b9b; }
</style>
</head>
<body>
<main>
  <h1>Halo CE</h1>
  <p id="msg">Starting…</p>
  <p><a href="../">&larr; All games</a></p>
</main>
<script>
(async () => {
  // Where the game's own page is, relative to this folder. If you keep the
  // built site (index.html, halo.js, halo.wasm, ...) in this folder itself,
  // set GAME to "./site-in-this-folder" or move this file's job to that page.
  const GAME = "port/web/site/";
  const msg = document.getElementById("msg");
  try {
    // The page loads halo.js and halo.wasm from its own folder: they exist
    // only after the web build (ninja web) has been run.
    const wasm = await fetch(GAME + "halo.wasm", { method: "HEAD", cache: "no-store" });
    const page = await fetch(GAME + "index.html", { method: "HEAD", cache: "no-store" });
    if (page.ok && wasm.ok) {
      location.replace(GAME);
      return;
    }
    msg.classList.add("err");
    msg.innerHTML = page.ok
      ? "The game page is here, but <code>halo.wasm</code> (and <code>halo.js</code>) are missing from <code>" +
        GAME + "</code>. Run the web build and put its output there."
      : "No game page found at <code>" + GAME + "</code>.";
  } catch (e) {
    msg.classList.add("err");
    msg.textContent = "Could not check for the game: " + e.message;
  }
})();
</script>
</body>
</html>
