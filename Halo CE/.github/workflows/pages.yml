name: Build and deploy to GitHub Pages

# Builds the web port with Emscripten and publishes the whole site:
#   site/            -> the launcher (index.html) and any other games
#   build/web/site   -> /halo/, the game
# (tools/assemble_site.py puts them together in dist/.)
#
# In the repository's settings: Pages -> Build and deployment -> Source:
# GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.10
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/halo_sdl3.py') }}

      - name: Install the toolchain
        run: |
          if [ ! -x ~/emsdk/upstream/emscripten/emcc ]; then
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Build the game
        env:
          HALO_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 configure.py --release --compiler-launcher ccache
          ninja web

      - name: Assemble the site
        run: python3 tools/assemble_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
